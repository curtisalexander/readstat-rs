# cargo-release configuration
# https://github.com/crate-ci/cargo-release/blob/master/docs/reference.md
#
# Typical release command (readstat and readstat-cli always share a version):
#
#   cargo release minor -p readstat -p readstat-cli --dry-run   # preview
#   cargo release minor -p readstat -p readstat-cli             # apply
#
# Then review the bump commit and tag, then:
#
#   git push origin main --follow-tags
#
# The sys crates version independently — bump only the one whose C bindings
# or vendored library changed (readstat-sys's dependency requirement on
# readstat-iconv-sys is the compatibility contract, checked by release-check):
#
#   cargo release patch -p readstat-sys

# Don't publish automatically — crates need vendor preparation first.
# See docs/RELEASING.md for the full manual publish workflow.
publish = false

# Don't push automatically — review the commit and tag before pushing.
push = false

# Create a git tag for the release.
tag = true
tag-name = "v{{version}}"

# Commit message for the version-bump commit.
#
# NOTE: with `consolidate-commits = true`, cargo-release only renders
# `{{version}}` when every workspace member shares one version — and this
# workspace never does (`readstat-tests` stays at 0.1.0, the sys crates
# version independently). A versioned template would land literally as
# "Release v{{version}}" (observed with cargo-release 1.1.2), so keep this
# message static; the version lives in the annotated tag, whose per-crate
# `tag-name`/message render fine. Amend the commit afterwards if you want
# the version in the subject line (historical style: "Release vX.Y.Z").
pre-release-commit-message = "chore: release"

# Combine the version-bump commits for all crates into one commit.
consolidate-commits = true
