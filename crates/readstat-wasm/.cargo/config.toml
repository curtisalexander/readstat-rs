[target.wasm32-unknown-emscripten]
rustflags = [
    "-Dwarnings",
    # Rust defaults Emscripten cdylibs to dynamic side modules. This package is
    # loaded directly by its JS wrapper, so emit a standalone main module.
    "-Clink-arg=-sSIDE_MODULE=0",
    "-Clink-arg=-sALLOW_MEMORY_GROWTH=1",
    "-Clink-arg=-sERROR_ON_UNDEFINED_SYMBOLS=0",
    "-Clink-arg=--no-entry",
    "-Clink-arg=-sEXPORTED_FUNCTIONS=_read_metadata,_read_metadata_fast,_read_preview,_read_data,_read_data_ndjson,_read_data_parquet,_read_data_feather,_read_data_reduced,_read_data_ndjson_reduced,_read_data_parquet_reduced,_read_data_feather_reduced,_read_data_arrow_stream_reduced,_create_arrow_stream_session,_read_arrow_stream_session_batch,_free_arrow_stream_session,_readstat_last_error,_free_string,_free_binary,_malloc,_free",
    "-Clink-arg=-sEXPORTED_RUNTIME_METHODS=ccall,cwrap,UTF8ToString,stringToUTF8,lengthBytesUTF8",
]
