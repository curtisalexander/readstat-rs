[package]
name = "readstat-iconv-sys"
version = "0.3.0"
authors = ["Curtis Alexander <calex@calex.org>"]
edition = "2024"
rust-version = "1.85"
description = "Windows-only FFI bindings to iconv (win-iconv) for character encoding conversion"
homepage = "https://github.com/curtisalexander/readstat-rs"
readme = "README.md"
license = "MIT"
repository = "https://github.com/curtisalexander/readstat-rs"
documentation = "https://docs.rs/readstat-iconv-sys"
keywords = ["iconv", "ffi", "bindings", "windows"]
categories = ["external-ffi-bindings"]
links = "iconv"
build = "build.rs"
include = [
    "build.rs",
    "src/**",
    "wrapper.h",
    "README.md",
    "vendor/win-iconv/win_iconv.c",
    "vendor/win-iconv/iconv.h",
    "vendor/win-iconv/localcharset.h",
    "vendor/win-iconv/readme.txt",
]

[build-dependencies]
bindgen = { workspace = true }
cc = { workspace = true }
