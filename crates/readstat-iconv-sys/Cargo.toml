[package]
name = "readstat-iconv-sys"
version = "0.4.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
# The vendored win-iconv is public domain (see vendor/win-iconv/readme.txt),
# which imposes no obligations, so the crate is plain MIT like the rest of
# the workspace.
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Windows-only FFI bindings to iconv (vendored public-domain win-iconv) for character encoding conversion"
readme = "README.md"
documentation = "https://docs.rs/readstat-iconv-sys"
keywords = ["iconv", "ffi", "bindings", "windows"]
categories = ["external-ffi-bindings"]
links = "iconv"
build = "build.rs"
# What ships in the crates.io package. Must live in [package] — placing it after
# a [[package.metadata...]] table header silently assigns it to that table.
include = [
    "build.rs",
    "src/**",
    "wrapper.h",
    "README.md",
    "LICENSE",
    "vendor/win-iconv/win_iconv.c",
    "vendor/win-iconv/iconv.h",
    "vendor/win-iconv/readme.txt",
]

# This crate is a no-op on non-Windows targets; docs.rs builds the default
# Linux target, which documents the crate-level overview without compiling
# win-iconv.
[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"

# Release-time version-string replacements live in `release.toml`.

[features]
# Default builds consume the checked-in pre-generated bindings under
# `src/bindings/` — no `libclang` at consumer build time. Enable
# `buildtime_bindgen` to regenerate the current target's file from
# `wrapper.h` (requires `libclang`); the build script writes the result to
# both `OUT_DIR` and `src/bindings/bindings_windows_<arch>.rs` so a maintainer
# can commit the diff.
default = []
buildtime_bindgen = ["dep:bindgen"]

[build-dependencies]
bindgen = { workspace = true, optional = true }
cc = { workspace = true }
