[package]
name = "readstat"
version = "0.26.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Read SAS binary files (.sas7bdat) and convert to Arrow, Parquet, CSV, and other formats"
documentation = "https://docs.rs/readstat"
readme = "README.md"
keywords = ["sas", "sas7bdat", "arrow", "parquet", "readstat"]
categories = ["parser-implementations", "science"]
# NOTE: `benches/` is intentionally NOT excluded — the manifest declares a
# `[[bench]]` target pointing into it, so excluding it would ship a manifest
# referencing a missing source file.
exclude = ["proptest-regressions/"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Release-time version-string replacements live in `release.toml` (single
# source of truth); `readstat/release.toml` updates both the `readstat` and
# `readstat-cli` ARCHITECTURE.md headings.

[[bench]]
name = "readstat_benchmarks"
harness = false

[dependencies]
# Arrow ecosystem crates (core — always required)
arrow = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }

# Arrow format writers (optional, feature-gated)
arrow-csv = { workspace = true, optional = true }
arrow-ipc = { workspace = true, optional = true }
arrow-json = { workspace = true, optional = true }
parquet = { workspace = true, optional = true }
tempfile = { version = "3", optional = true }

chrono = { workspace = true }
crossbeam = { workspace = true }
log = { workspace = true }
num-derive = "0.4"
num-traits = "0.2"
regex = "1.12"
serde = { workspace = true }
serde_json = "1"
thiserror = "2"

[features]
default = ["csv", "parquet", "feather", "ndjson", "sql"]
csv = ["dep:arrow-csv"]
parquet = ["dep:parquet", "dep:tempfile"]
feather = ["dep:arrow-ipc"]
ndjson = ["dep:arrow-json"]
# SQL output delegates to ReadStatWriter, so enable its supported formats.
sql = ["dep:datafusion", "dep:tokio", "dep:futures", "csv", "parquet", "feather", "ndjson"]

[dependencies.datafusion]
version = "54"
optional = true

[dependencies.tokio]
version = "1"
features = ["rt-multi-thread", "sync"]
optional = true

[dependencies.futures]
version = "0.3"
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
memmap2 = "0.9"
path_abs = { workspace = true }
rayon = { workspace = true }

[target.'cfg(not(target_os = "emscripten"))'.dependencies]
readstat-sys = { path = "../readstat-sys", version = "0.5.1" }

# Emscripten has no portable pre-generated bindings because its sysroot is part
# of emsdk. Enable target-local generation automatically for WASM consumers.
[target.'cfg(target_os = "emscripten")'.dependencies]
readstat-sys = { path = "../readstat-sys", version = "0.5.1", features = ["buildtime_bindgen"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1"
tempfile = "3"
