# Per-crate cargo-release config for `readstat`.
# Inherits workspace defaults from release.toml at the repo root.
#
# Substitutes the version strings in ARCHITECTURE.md so the headings
# stay in sync without manual edits.

[[pre-release-replacements]]
file = "../../docs/ARCHITECTURE.md"
search = "### `readstat` \\(v[0-9]+\\.[0-9]+\\.[0-9]+\\)"
replace = "### `readstat` (v{{version}})"
exactly = 1

[[pre-release-replacements]]
file = "../../docs/ARCHITECTURE.md"
search = "### `readstat-cli` \\(v[0-9]+\\.[0-9]+\\.[0-9]+\\)"
replace = "### `readstat-cli` (v{{version}})"
exactly = 1

[[pre-release-replacements]]
file = "../readstat-wasm/Cargo.toml"
search = '(?m)^version = "[0-9]+\.[0-9]+\.[0-9]+"$'
replace = 'version = "{{version}}"'
exactly = 1

[[pre-release-replacements]]
file = "../readstat-wasm/pkg/package.json"
search = '(?m)^  "version": "[0-9]+\.[0-9]+\.[0-9]+",$'
replace = '  "version": "{{version}}",'
exactly = 1

[[pre-release-replacements]]
file = "../readstat-wasm/Cargo.lock"
search = '(?m)(name = "readstat"\n)version = "[0-9]+\.[0-9]+\.[0-9]+"'
replace = '${1}version = "{{version}}"'
exactly = 1

[[pre-release-replacements]]
file = "../readstat-wasm/Cargo.lock"
search = '(?m)(name = "readstat-wasm"\n)version = "[0-9]+\.[0-9]+\.[0-9]+"'
replace = '${1}version = "{{version}}"'
exactly = 1

[[pre-release-replacements]]
file = "../../docs/ARCHITECTURE.md"
search = "### `readstat-wasm` \\(v[0-9]+\\.[0-9]+\\.[0-9]+\\)"
replace = "### `readstat-wasm` (v{{version}})"
exactly = 1

[[pre-release-replacements]]
file = "../../docs/readstat-cheatsheet.html"
search = "readstat-cli <strong style=\"color:#6366f1\">v[0-9]+\\.[0-9]+\\.[0-9]+</strong>"
replace = "readstat-cli <strong style=\"color:#6366f1\">v{{version}}</strong>"
exactly = 1
