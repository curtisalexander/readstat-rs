# Per-crate cargo-release config for `readstat-sys`.
# Inherits workspace defaults from release.toml at the repo root.
#
# No git tag for sys-crate releases: tags are reserved for readstat/readstat-cli
# releases (`v*`, which trigger the GitHub Release build). A sys release is a
# crates.io-only event — its version marker is the "Release readstat-sys vX.Y.Z"
# bump commit and the CHANGELOG entry.
tag = false

# Keep the crate version cited in docs/ARCHITECTURE.md in sync on release.
[[pre-release-replacements]]
file = "../../docs/ARCHITECTURE.md"
search = "### `readstat-sys` \\(v[0-9]+\\.[0-9]+\\.[0-9]+\\)"
replace = "### `readstat-sys` (v{{version}})"
exactly = 1
