name: Deploy Book to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: "-D warnings"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install mdBook
        uses: taiki-e/install-action@mdbook

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten

      - name: Install Emscripten
        uses: emscripten-core/setup-emsdk@v16

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang

      - name: Build SAS Explorer DuckDB assets
        run: |
          npm ci --ignore-scripts
          npm run build:sas-explorer-vendor

      - name: Build SAS Explorer WASM
        working-directory: crates/readstat-wasm
        run: cargo build --locked --target wasm32-unknown-emscripten --release

      - name: Copy docs into book/src
        run: bash scripts/build-book.sh --docs

      - name: Add SAS Explorer to Pages artifact
        run: |
          mkdir -p target/book/explorer
          cp examples/sas-explorer/index.html target/book/explorer/
          cp examples/sas-explorer/app.js target/book/explorer/
          cp examples/sas-explorer/worker.js target/book/explorer/
          cp examples/sas-explorer/readstat_wasm.js target/book/explorer/
          cp -R examples/sas-explorer/vendor target/book/explorer/
          cp crates/readstat-wasm/target/wasm32-unknown-emscripten/release/readstat_wasm.wasm target/book/explorer/
          test -s target/book/explorer/index.html
          test -s target/book/explorer/app.js
          test -s target/book/explorer/worker.js
          test -s target/book/explorer/readstat_wasm.js
          test -s target/book/explorer/readstat_wasm.wasm
          test -s target/book/explorer/vendor/duckdb-browser.mjs
          test -s target/book/explorer/vendor/duckdb-eh.wasm
          test -s target/book/explorer/vendor/duckdb-mvp.wasm
          test -s target/book/explorer/vendor/THIRD_PARTY_NOTICES.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
