name: readstat-rs

env:
  PACKAGE_NAME: readstat
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: "-D warnings"

on:
  # Trigger on release tag push. Only `v*` tags (readstat/readstat-cli
  # releases, e.g. v0.25.1) build binaries and create a GitHub Release.
  # Sys-crate releases are never tagged (their release.toml sets tag = false)
  # and must NOT produce GitHub Releases; the v* filter is defense in depth
  # against any stray non-release tag.
  push:
    tags:
      - "v*"
    # Trigger tests (but not releases) on branch pushes
    branches: [main, dev]

  # Trigger tests on PRs targeting main or dev
  pull_request:
    branches: [main, dev]

  # Manual trigger from GitHub Actions UI (build-only, no releases)
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string for artifacts (e.g., v0.14.0 or dev)'
        required: false
        default: 'dev'

  # API trigger for external tools (e.g., Claude Code)
  repository_dispatch:
    types: [build, test, release]

  # Comprehensive memory-safety checks run nightly as well as before releases.
  schedule:
    - cron: "0 4 * * *"

jobs:
  # Fast, required feedback for every branch, PR, and tag. SQL's expensive
  # code generation and tests run independently below so both jobs start at
  # once and failures are attributed to the owning subsystem.
  verify:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Check Arrow/DataFusion lockstep
        run: ./scripts/check-arrow-lockstep.sh
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update -y && sudo apt-get install -y build-essential clang
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy without SQL
        run: |
          cargo clippy -p readstat --all-targets --no-default-features --features csv,parquet,feather,ndjson -- -D warnings
          cargo clippy -p readstat-cli --all-targets --no-default-features --features csv,parquet,feather,ndjson -- -D warnings
          cargo clippy -p readstat-sys -p readstat-iconv-sys --all-targets -- -D warnings
      - name: Check format features without SQL
        run: |
          cargo check -p readstat --all-targets --no-default-features --features csv,parquet,feather,ndjson
          cargo check -p readstat-cli --all-targets --no-default-features --features csv,parquet,feather,ndjson
      - name: Check minimal feature builds
        run: |
          cargo check -p readstat --no-default-features
          cargo check -p readstat-cli --no-default-features
      - name: Test core library without default features
        run: cargo test -p readstat --no-default-features
      - name: Install mdBook
        uses: taiki-e/install-action@mdbook
      - name: Build documentation book
        run: bash scripts/build-book.sh
      - name: Check WASM crate on host
        run: |
          cargo fmt --manifest-path crates/readstat-wasm/Cargo.toml -- --check
          cargo clippy --manifest-path crates/readstat-wasm/Cargo.toml --all-targets -- -D warnings
      - name: Check package contents
        run: |
          for crate in readstat-iconv-sys readstat-sys readstat readstat-cli; do
            cargo package -p "$crate" --allow-dirty --list >/dev/null
          done

  # SQL is part of the default API and remains a required PR gate. Keep its
  # full code-generation/linking cost in one Linux job instead of repeating it
  # in every native-platform binding job. The standalone examples share this
  # job's target directory so their default-feature builds reuse DataFusion.
  sql:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update -y && sudo apt-get install -y build-essential clang
      - name: Clippy with all features
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test workspace with all features
        run: cargo test --workspace --all-features
      - name: Rustdoc with all features
        run: cargo doc --workspace --all-features --no-deps
      - name: Check advertised API examples
        run: |
          cargo check --manifest-path examples/api-demo/rust-server/Cargo.toml
          cargo check --manifest-path examples/api-demo/python-server/readstat_py/Cargo.toml

  # The WASM crate is excluded from the workspace and needs Emscripten to link,
  # so host clippy alone cannot establish that the published JS artifact builds.
  wasm:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/readstat-wasm
      - name: Install Emscripten
        uses: emscripten-core/setup-emsdk@v16
      - name: Build WASM crate
        working-directory: crates/readstat-wasm
        run: cargo build --target wasm32-unknown-emscripten --release
      - name: Smoke-test generated WASM package
        working-directory: crates/readstat-wasm
        run: |
          cp target/wasm32-unknown-emscripten/release/readstat_wasm.wasm pkg/readstat_wasm.wasm
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { init, read_metadata } from "./pkg/readstat_wasm.js";

          await init();
          const input = readFileSync("../readstat-tests/tests/data/cars.sas7bdat");
          const metadata = JSON.parse(read_metadata(input));
          if (metadata.row_count <= 0 || metadata.var_count <= 0) {
            throw new Error(`unexpected metadata: ${JSON.stringify(metadata)}`);
          }
          NODE

  # Enforce the MSRV declared in `[workspace.package] rust-version` (and
  # advertised in the READMEs): the workspace must at least type-check on that
  # exact toolchain. `--all-features` is applied per-crate (not workspace-wide)
  # so `readstat-sys/buildtime_bindgen` stays off — it would drag in
  # bindgen/libclang, which is irrelevant to the MSRV contract.
  msrv:
    if: github.event_name != 'schedule' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update -y && sudo apt-get install -y build-essential
      - name: Check workspace (default features)
        run: cargo check --workspace --all-targets
      - name: Check readstat + readstat-cli (all features, incl. sql)
        run: cargo check -p readstat -p readstat-cli --all-features --all-targets

  release-notes:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify, sql, wasm, miri, asan-linux, asan-macos, asan-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate changelog
        run: |
          CURRENT_TAG=${GITHUB_REF#refs/tags/}
          PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -v "^${CURRENT_TAG}$" | head -1 || echo "")
          if [ -n "$PREVIOUS_TAG" ]; then
            RANGE="${PREVIOUS_TAG}..${CURRENT_TAG}"
          else
            RANGE="${CURRENT_TAG}"
          fi
          {
            echo "## What's Changed in ${CURRENT_TAG}"
            echo ""
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "**Full Changelog**: \`${PREVIOUS_TAG}...${CURRENT_TAG}\`"
              echo ""
            fi
            # Collect commits
            FEATURES=""
            FIXES=""
            OTHER=""
            while IFS= read -r line; do
              subject=$(echo "$line" | sed 's/^[a-f0-9]* //')
              hash=$(echo "$line" | awk '{print $1}')
              entry="- ${subject} (${hash})"
              lower=$(echo "$subject" | tr '[:upper:]' '[:lower:]')
              if echo "$lower" | grep -qE "^(add|implement|support|introduce|create|enable)"; then
                FEATURES="${FEATURES}${entry}\n"
              elif echo "$lower" | grep -qE "^(fix|correct|resolve|patch|address|repair)"; then
                FIXES="${FIXES}${entry}\n"
              else
                OTHER="${OTHER}${entry}\n"
              fi
            done < <(git log --oneline --no-merges "$RANGE" 2>/dev/null)
            if [ -n "$FEATURES" ]; then
              echo "### Added"
              echo -e "$FEATURES"
            fi
            if [ -n "$FIXES" ]; then
              echo "### Fixed"
              echo -e "$FIXES"
            fi
            if [ -n "$OTHER" ]; then
              echo "### Changed"
              echo -e "$OTHER"
            fi
          } > release-notes.md
      - name: Create release with notes
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-gnu:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    needs: [verify, sql, wasm, miri, asan-linux, asan-macos, asan-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      target: x86_64-unknown-linux-gnu
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version || 'dev' }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${{ github.event.client_payload.version || 'dev' }}" >> $GITHUB_OUTPUT
          fi
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.target }}
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Build
        run: cargo build --release && strip target/release/${{ env.PACKAGE_NAME }}
      - name: Zip
        run: tar czvf target/release/${{ env.PACKAGE_NAME }}-${{ steps.get_version.outputs.VERSION }}-${{ env.target }}.tar.gz --directory=target/release ${{ env.PACKAGE_NAME }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE_NAME }}-${{ steps.get_version.outputs.VERSION }}-${{ env.target }}
          path: target/release/${{ env.PACKAGE_NAME }}-${{ steps.get_version.outputs.VERSION }}-${{ env.target }}.tar.gz
      - name: Release
        uses: softprops/action-gh-release@v3
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            target/release/${{ env.PACKAGE_NAME }}-${{ steps.get_version.outputs.VERSION }}-${{ env.target }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-linux-musl:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    needs: [verify, sql, wasm, miri, asan-linux, asan-macos, asan-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      target: x86_64-unknown-linux-musl
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version || 'dev' }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${{ github.event.client_payload.version || 'dev' }}" >> $GITHUB_OUTPUT
          fi
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.target }}
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Add musl-tools
        run: sudo apt-get update -y && sudo apt-get upgrade -y && sudo apt-get install build-essential musl musl-dev musl-tools libclang-dev clang -y
      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-musl && strip target/${{ env.target }}/release/${{ env.PACKAGE_NAME }}
      - name: Zip
        run: tar czvf target/${{ env.target }}/release/${{ env.PACKAGE_NAME }}-${{ steps.get_version.outputs.VERSION }}-${{ env.target }}.tar.gz --directory=target/${{ env.target }}/release ${{ env.PACKAGE_NAME }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE_NAME }}-${{ steps.get_version.outputs.VERSION }}-${{ env.target }}
          path: target/${{ env.target }}/release/${{ env.PACKAGE_NAME }}-${{ steps.get_version.outputs.VERSION }}-${{ env.target }}.tar.gz
      - name: Release
        uses: softprops/action-gh-release@v3
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            target/${{ env.target }}/release/${{ env.PACKAGE_NAME }}-${{ steps.get_version.outputs.VERSION }}-${{ env.target }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-linux-arm:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    needs: [verify, sql, wasm, miri, asan-linux, asan-macos, asan-windows]
    # Native arm64 runner (same image the readstat-sys cross-platform CI uses):
    # no cross toolchain or CC_/AR_/LINKER plumbing, and — unlike the old
    # cross-compile job — the test suite actually runs on the artifact's
    # platform before it ships.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    env:
      target: aarch64-unknown-linux-gnu
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version || 'dev' }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${{ github.event.client_payload.version || 'dev' }}" >> $GITHUB_OUTPUT
          fi
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.target }}
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Build
        # Explicit --target keeps the artifact path identical to the old
        # cross-compile job and is robust to the runner's host arch.
        run: |
          cargo build --release --target ${{ env.target }}
          strip target/${{ env.target }}/release/${{ env.PACKAGE_NAME }}
      - name: Zip
        run: tar czvf target/${{ env.target }}/release/${{ env.PACKAGE_NAME }}-${{ steps.get_version.outputs.VERSION }}-${{ env.target }}.tar.gz --directory=target/${{ env.target }}/release ${{ env.PACKAGE_NAME }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE_NAME }}-${{ steps.get_version.outputs.VERSION }}-${{ env.target }}
          path: target/${{ env.target }}/release/${{ env.PACKAGE_NAME }}-${{ steps.get_version.outputs.VERSION }}-${{ env.target }}.tar.gz
      - name: Release
        uses: softprops/action-gh-release@v3
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            target/${{ env.target }}/release/${{ env.PACKAGE_NAME }}-${{ steps.get_version.outputs.VERSION }}-${{ env.target }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-win-msvc:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    needs: [verify, sql, wasm, miri, asan-linux, asan-macos, asan-windows]
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      target: x86_64-pc-windows-msvc
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version || 'dev' }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${{ github.event.client_payload.version || 'dev' }}" >> $GITHUB_OUTPUT
          fi
        shell: bash
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.target }}
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Zip
        run: Compress-Archive -Path target\release\${{ env.PACKAGE_NAME }}.exe -DestinationPath target\release\${{ env.PACKAGE_NAME }}-${{ steps.get_version.outputs.VERSION }}-${{ env.target }}.zip  -CompressionLevel Optimal
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE_NAME }}-${{ steps.get_version.outputs.VERSION }}-${{ env.target }}
          path: target/release/${{ env.PACKAGE_NAME }}-${{ steps.get_version.outputs.VERSION }}-${{ env.target }}.zip
      - name: Release
        uses: softprops/action-gh-release@v3
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            target/release/${{ env.PACKAGE_NAME }}-${{ steps.get_version.outputs.VERSION }}-${{ env.target }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-win-gnu:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    needs: [verify, sql, wasm, miri, asan-linux, asan-macos, asan-windows]
    # windows-gnu flavor: statically linked against the MinGW runtime, so the
    # binary has no MSVC runtime dependency. The runner image ships a MinGW
    # gcc/binutils on PATH, which rustc uses as the linker and cc uses to
    # compile the vendored C (ReadStat, win-iconv); readstat-sys has
    # pre-generated windows-gnu bindings, so no libclang is needed.
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      target: x86_64-pc-windows-gnu
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version || 'dev' }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${{ github.event.client_payload.version || 'dev' }}" >> $GITHUB_OUTPUT
          fi
        shell: bash
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.target }}
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --target ${{ env.target }}
      - name: Zip
        run: Compress-Archive -Path target\${{ env.target }}\release\${{ env.PACKAGE_NAME }}.exe -DestinationPath target\${{ env.target }}\release\${{ env.PACKAGE_NAME }}-${{ steps.get_version.outputs.VERSION }}-${{ env.target }}.zip  -CompressionLevel Optimal
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE_NAME }}-${{ steps.get_version.outputs.VERSION }}-${{ env.target }}
          path: target/${{ env.target }}/release/${{ env.PACKAGE_NAME }}-${{ steps.get_version.outputs.VERSION }}-${{ env.target }}.zip
      - name: Release
        uses: softprops/action-gh-release@v3
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            target/${{ env.target }}/release/${{ env.PACKAGE_NAME }}-${{ steps.get_version.outputs.VERSION }}-${{ env.target }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-macos-x86:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    needs: [verify, sql, wasm, miri, asan-linux, asan-macos, asan-windows]
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      target: x86_64-apple-darwin
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version || 'dev' }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${{ github.event.client_payload.version || 'dev' }}" >> $GITHUB_OUTPUT
          fi
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.target }}
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Build
        # macos-latest is an arm64 runner; build with an explicit --target so
        # the x86_64 artifact is actually an x86_64 binary (a bare
        # `cargo build` would cross-label an arm64 binary as x86_64).
        run: cargo build --release --target ${{ env.target }} && strip target/${{ env.target }}/release/${{ env.PACKAGE_NAME }}
      - name: Zip
        run: tar czvf target/${{ env.target }}/release/${{ env.PACKAGE_NAME }}-${{ steps.get_version.outputs.VERSION }}-${{ env.target }}.tar.gz --directory=target/${{ env.target }}/release ${{ env.PACKAGE_NAME }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE_NAME }}-${{ steps.get_version.outputs.VERSION }}-${{ env.target }}
          path: target/${{ env.target }}/release/${{ env.PACKAGE_NAME }}-${{ steps.get_version.outputs.VERSION }}-${{ env.target }}.tar.gz
      - name: Release
        uses: softprops/action-gh-release@v3
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            target/${{ env.target }}/release/${{ env.PACKAGE_NAME }}-${{ steps.get_version.outputs.VERSION }}-${{ env.target }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos-arm:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    needs: [verify, sql, wasm, miri, asan-linux, asan-macos, asan-windows]
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      target: aarch64-apple-darwin
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version || 'dev' }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${{ github.event.client_payload.version || 'dev' }}" >> $GITHUB_OUTPUT
          fi
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.target }}
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Build
        # Explicit --target keeps the output path consistent with the x86 job
        # and is robust to the runner's host arch.
        run: cargo build --release --target ${{ env.target }} && strip target/${{ env.target }}/release/${{ env.PACKAGE_NAME }}
      - name: Zip
        run: tar czvf target/${{ env.target }}/release/${{ env.PACKAGE_NAME }}-${{ steps.get_version.outputs.VERSION }}-${{ env.target }}.tar.gz --directory=target/${{ env.target }}/release ${{ env.PACKAGE_NAME }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE_NAME }}-${{ steps.get_version.outputs.VERSION }}-${{ env.target }}
          path: target/${{ env.target }}/release/${{ env.PACKAGE_NAME }}-${{ steps.get_version.outputs.VERSION }}-${{ env.target }}.tar.gz
      - name: Release
        uses: softprops/action-gh-release@v3
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            target/${{ env.target }}/release/${{ env.PACKAGE_NAME }}-${{ steps.get_version.outputs.VERSION }}-${{ env.target }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- Memory safety checks ---

  miri:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    env:
      MIRIFLAGS: "-Zmiri-disable-isolation"
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install nightly toolchain with Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Run Miri on pure-Rust unit tests
        # Skip proptest suites: they run 256 cases each and are 100-1000x slower
        # under Miri's interpreter. All proptest tests live in `property_tests`
        # submodules. Everything else (ptr_to_string unsafe, build_offsets, err,
        # rs_path) runs and gives Miri coverage over both unsafe and safe Rust.
        run: cargo +nightly miri test -p readstat --no-default-features -- --skip property_tests

  asan-linux:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings -Zsanitizer=address -Clinker=clang"
      READSTAT_SANITIZE_ADDRESS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Run tests with AddressSanitizer
        run: cargo +nightly test --workspace --lib --tests --bins --target x86_64-unknown-linux-gnu

  asan-macos:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    runs-on: macos-latest
    env:
      RUSTFLAGS: "-D warnings -Zsanitizer=address"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-apple-darwin
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Run tests with AddressSanitizer
        run: cargo +nightly test --workspace --lib --tests --bins --target aarch64-apple-darwin

  asan-windows:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    runs-on: windows-latest
    env:
      RUSTFLAGS: "-D warnings -Zsanitizer=address"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      # The ASAN runtime comes from Visual Studio (MSVC). `readstat-sys`
      # ships pre-generated bindings, so no LLVM/libclang install needed.
      - name: Find MSVC ASAN runtime
        id: asan-rt
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -property installationPath
          $msvcRoot = Join-Path $vsPath "VC\Tools\MSVC"
          $msvcVer = (Get-ChildItem $msvcRoot | Sort-Object Name -Descending | Select-Object -First 1).Name
          $asanDir = Join-Path $msvcRoot $msvcVer "bin" "Hostx64" "x64"
          $asanDll = Join-Path $asanDir "clang_rt.asan_dynamic-x86_64.dll"
          if (!(Test-Path $asanDll)) { throw "ASAN runtime not found at $asanDll" }
          Write-Host "Found ASAN runtime: $asanDll"
          echo "dir=$asanDir" >> $env:GITHUB_OUTPUT
      - name: Run tests with AddressSanitizer
        run: |
            $env:PATH = "${{ steps.asan-rt.outputs.dir }};$env:PATH"
            cargo +nightly test --workspace --lib --tests --bins --target x86_64-pc-windows-msvc

  # Option 2: Full Rust + C ASAN instrumentation on Windows.
  # Both Rust and MSVC's cl.exe use the same MSVC ASAN runtime, so full
  # instrumentation SHOULD work. Marked continue-on-error because this is
  # experimental — no one has publicly documented this combination working.
  asan-windows-full:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    runs-on: windows-latest
    continue-on-error: true
    env:
      RUSTFLAGS: "-D warnings -Zsanitizer=address"
      READSTAT_SANITIZE_ADDRESS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      # The ASAN runtime comes from Visual Studio (MSVC). `readstat-sys`
      # ships pre-generated bindings, so no LLVM/libclang install needed.
      - name: Find MSVC ASAN runtime
        id: asan-rt
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -property installationPath
          $msvcRoot = Join-Path $vsPath "VC\Tools\MSVC"
          $msvcVer = (Get-ChildItem $msvcRoot | Sort-Object Name -Descending | Select-Object -First 1).Name
          $asanDir = Join-Path $msvcRoot $msvcVer "bin" "Hostx64" "x64"
          $asanDll = Join-Path $asanDir "clang_rt.asan_dynamic-x86_64.dll"
          if (!(Test-Path $asanDll)) { throw "ASAN runtime not found at $asanDll" }
          Write-Host "Found ASAN runtime: $asanDll"
          echo "dir=$asanDir" >> $env:GITHUB_OUTPUT
      - name: Run tests with AddressSanitizer (full C+Rust)
        run: |
            $env:PATH = "${{ steps.asan-rt.outputs.dir }};$env:PATH"
            cargo +nightly test --workspace --lib --tests --bins --target x86_64-pc-windows-msvc
