name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:
  workflow_call:
    inputs:
      release_call:
        description: Use release-safe concurrency
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ (inputs.release_call || github.event_name == 'workflow_dispatch') && format('ci-run-{0}-{1}', github.run_id, github.run_attempt) || format('ci-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ !inputs.release_call && (github.event_name == 'push' || github.event_name == 'pull_request') }}

env:
  PACKAGE_NAME: readstat
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: "-D warnings"

jobs:
  # Fast, required feedback for every branch, PR, and tag. SQL's expensive
  # code generation and tests run independently below so both jobs start at
  # once and failures are attributed to the owning subsystem.
  verify:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Check Arrow/DataFusion lockstep
        run: ./scripts/check-arrow-lockstep.sh
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update -y && sudo apt-get install -y build-essential clang
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy without SQL
        run: |
          cargo clippy -p readstat --all-targets --no-default-features --features csv,parquet,feather,ndjson -- -D warnings
          cargo clippy -p readstat-cli --all-targets --no-default-features --features csv,parquet,feather,ndjson -- -D warnings
          cargo clippy -p readstat-sys -p readstat-iconv-sys --all-targets -- -D warnings
      - name: Check format features without SQL
        run: |
          cargo check -p readstat --all-targets --no-default-features --features csv,parquet,feather,ndjson
          cargo check -p readstat-cli --all-targets --no-default-features --features csv,parquet,feather,ndjson
      - name: Check minimal feature builds
        run: |
          cargo check -p readstat --no-default-features
          cargo check -p readstat-cli --no-default-features
      - name: Test core library without default features
        run: cargo test -p readstat --no-default-features
      - name: Install mdBook
        uses: taiki-e/install-action@mdbook
      - name: Build documentation book
        run: bash scripts/build-book.sh
      - name: Check SAS Explorer JavaScript
        run: |
          node --input-type=module --check < examples/sas-explorer/app.js
          node --input-type=module --check < examples/sas-explorer/worker.js
          node --input-type=module --check < examples/sas-explorer/readstat_wasm.js
      - name: Check WASM crate on host
        run: |
          cargo fmt --manifest-path crates/readstat-wasm/Cargo.toml -- --check
          cargo clippy --locked --manifest-path crates/readstat-wasm/Cargo.toml --all-targets -- -D warnings
      - name: Check package contents
        run: |
          for crate in readstat-iconv-sys readstat-sys readstat readstat-cli; do
            cargo package -p "$crate" --allow-dirty --list >/dev/null
          done

  # SQL remains part of the library's default API and an opt-in CLI feature,
  # so it is a required PR gate. Keep its full code-generation/linking cost in
  # one Linux job instead of repeating it in every native-platform binding job.
  # The standalone examples share this job's target directory so their
  # default-feature builds reuse DataFusion.
  sql:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update -y && sudo apt-get install -y build-essential clang
      - name: Clippy with all features
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test workspace with all features
        run: cargo test --workspace --all-features
      - name: Rustdoc with all features
        run: cargo doc --workspace --all-features --no-deps
      - name: Check advertised API examples
        run: |
          cargo check --manifest-path examples/api-demo/rust-server/Cargo.toml
          cargo check --manifest-path examples/api-demo/python-server/readstat_py/Cargo.toml

  # The WASM crate is excluded from the workspace and needs Emscripten to link,
  # so host clippy alone cannot establish that the published JS artifact builds.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/readstat-wasm
      - name: Install Emscripten
        uses: emscripten-core/setup-emsdk@v16
      - name: Set up Python for browser round-trip test
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install browser round-trip test dependencies
        run: |
          python -m pip install playwright==1.54.0 pyarrow==21.0.0
          python -m playwright install --with-deps chromium
      - name: Build WASM crate
        working-directory: crates/readstat-wasm
        run: cargo build --locked --target wasm32-unknown-emscripten --release
      - name: Smoke-test generated WASM package
        working-directory: crates/readstat-wasm
        run: |
          cp target/wasm32-unknown-emscripten/release/readstat_wasm.wasm pkg/readstat_wasm.wasm
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import {
            init,
            read_data,
            read_data_feather,
            read_data_feather_reduced,
            read_data_ndjson,
            read_data_ndjson_reduced,
            read_data_parquet,
            read_data_parquet_reduced,
            read_data_reduced,
            read_metadata,
            read_preview,
          } from "./pkg/readstat_wasm.js";

          const progress = [];
          await init({ onProgress: event => progress.push(event) });
          const input = readFileSync("../readstat-tests/tests/data/cars.sas7bdat");
          const metadata = JSON.parse(read_metadata(input));
          if (metadata.row_count <= 0 || metadata.var_count <= 0) {
            throw new Error(`unexpected metadata: ${JSON.stringify(metadata)}`);
          }
          const preview = read_preview(input, 5).trim().split("\n").filter(Boolean);
          if (preview.length !== 5 || preview.some(line => !JSON.parse(line))) {
            throw new Error(`unexpected bounded preview: ${preview.length} rows`);
          }
          if (!progress.some(event => event.stage === 2 && event.current === 5)) {
            throw new Error(`preview progress was not reported: ${JSON.stringify(progress)}`);
          }
          const csv = read_data(input);
          const ndjson = read_data_ndjson(input);
          const parquet = read_data_parquet(input);
          const feather = read_data_feather(input);
          const selection = { columns: ["Brand", "Model", "CityMPG"], rowOffset: 10, rowLimit: 7 };
          const reducedCsv = read_data_reduced(input, selection);
          const reducedNdjson = read_data_ndjson_reduced(input, selection);
          const reducedParquet = read_data_parquet_reduced(input, selection);
          const reducedFeather = read_data_feather_reduced(input, selection);
          if (!csv.startsWith("Brand,") || ndjson.trim().split("\n").length !== metadata.row_count) {
            throw new Error("text exports were not complete");
          }
          if (!reducedCsv.startsWith("Brand,Model,CityMPG") || reducedCsv.trim().split("\n").length !== 8 || reducedNdjson.trim().split("\n").length !== 7) {
            throw new Error("reduced text exports did not honor their rows and columns");
          }
          if (Buffer.from(parquet.subarray(0, 4)).toString() !== "PAR1") {
            throw new Error("Parquet export has an invalid header");
          }
          if (Buffer.from(feather.subarray(0, 6)).toString() !== "ARROW1") {
            throw new Error("Feather export has an invalid header");
          }
          if (Buffer.from(reducedParquet.subarray(0, 4)).toString() !== "PAR1" || Buffer.from(reducedFeather.subarray(0, 6)).toString() !== "ARROW1") {
            throw new Error("reduced binary exports have invalid headers");
          }
          for (const invalid of [
            { columns: ["NoSuchColumn"], rowOffset: 0, rowLimit: 1 },
            { columns: ["Brand"], rowOffset: metadata.row_count, rowLimit: 1 },
          ]) {
            let reducedError;
            try {
              read_data_reduced(input, invalid);
            } catch (error) {
              reducedError = error;
            }
            if (!reducedError?.message) {
              throw new Error(`invalid reduced selection unexpectedly succeeded: ${JSON.stringify(invalid)}`);
            }
          }
          if (!progress.some(event => event.stage === 4) || !progress.some(event => event.stage === 5)) {
            throw new Error(`export progress was not reported: ${JSON.stringify(progress)}`);
          }
          let nativeError;
          try {
            read_metadata(new Uint8Array([1, 2, 3]));
          } catch (error) {
            nativeError = error;
          }
          if (!nativeError) {
            throw new Error("invalid input unexpectedly succeeded");
          }
          if (!nativeError.message || nativeError.message.includes("returned null")) {
            throw new Error(`WASM did not surface its native error: ${nativeError.message}`);
          }
          NODE
          cp ../../examples/sas-explorer/readstat_wasm.js target/sas_explorer_wrapper.mjs
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const wasm = readFileSync("target/wasm32-unknown-emscripten/release/readstat_wasm.wasm");
          globalThis.fetch = async () => new Response(wasm, {
            headers: { "Content-Length": String(wasm.byteLength) },
          });
          const {
            init,
            read_data,
            read_data_feather,
            read_data_feather_reduced,
            read_data_ndjson,
            read_data_ndjson_reduced,
            read_data_parquet,
            read_data_parquet_reduced,
            read_data_reduced,
          } = await import("./target/sas_explorer_wrapper.mjs");

          const progress = [];
          await init({ onProgress: event => progress.push(event) });
          const input = readFileSync("../readstat-tests/tests/data/cars.sas7bdat");
          const csv = read_data(input);
          const ndjson = read_data_ndjson(input);
          const parquet = read_data_parquet(input);
          const feather = read_data_feather(input);
          const selection = { columns: ["Brand", "Model", "CityMPG"], rowOffset: 10, rowLimit: 7 };
          const reducedCsv = read_data_reduced(input, selection);
          const reducedNdjson = read_data_ndjson_reduced(input, selection);
          const reducedParquet = read_data_parquet_reduced(input, selection);
          const reducedFeather = read_data_feather_reduced(input, selection);
          if (!csv.startsWith("Brand,") || ndjson.trim().split("\n").length !== 1081) {
            throw new Error("SAS Explorer text exports were not complete");
          }
          if (!reducedCsv.startsWith("Brand,Model,CityMPG") || reducedCsv.trim().split("\n").length !== 8 || reducedNdjson.trim().split("\n").length !== 7) {
            throw new Error("SAS Explorer reduced text exports were incorrect");
          }
          if (Buffer.from(parquet.subarray(0, 4)).toString() !== "PAR1") {
            throw new Error("SAS Explorer Parquet export has an invalid header");
          }
          if (Buffer.from(feather.subarray(0, 6)).toString() !== "ARROW1") {
            throw new Error("SAS Explorer Feather export has an invalid header");
          }
          if (Buffer.from(reducedParquet.subarray(0, 4)).toString() !== "PAR1" || Buffer.from(reducedFeather.subarray(0, 6)).toString() !== "ARROW1") {
            throw new Error("SAS Explorer reduced binary exports have invalid headers");
          }
          if (!progress.some(event => event.stage === "export-parse") ||
              !progress.some(event => event.stage === "export-encode")) {
            throw new Error(`SAS Explorer export progress was not reported: ${JSON.stringify(progress)}`);
          }
          NODE

      - name: Test SAS Explorer browser download round-trip
        run: |
          cp crates/readstat-wasm/target/wasm32-unknown-emscripten/release/readstat_wasm.wasm examples/sas-explorer/
          python examples/sas-explorer/e2e_test.py

  # Enforce the MSRV declared in `[workspace.package] rust-version` (and
  # advertised in the READMEs): the workspace must at least type-check on that
  # exact toolchain. `--all-features` is applied per-crate (not workspace-wide)
  # so `readstat-sys/buildtime_bindgen` stays off — it would drag in
  # bindgen/libclang, which is irrelevant to the MSRV contract.
  msrv:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update -y && sudo apt-get install -y build-essential
      - name: Check workspace (default features)
        run: cargo check --workspace --all-targets
      - name: Check readstat + readstat-cli (all features, incl. sql)
        run: cargo check -p readstat -p readstat-cli --all-features --all-targets
