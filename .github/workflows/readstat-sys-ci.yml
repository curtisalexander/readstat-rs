name: readstat-sys cross-platform CI

# Runs on every PR (and direct push to main) that touches `readstat-sys`
# itself, the vendored C sources, or this workflow. Two job matrices:
#
#   * `consume`: builds the workspace + runs all tests on
#     ubuntu/macos/windows using the checked-in per-target pre-gen
#     bindings. This is the load-bearing check — it proves the
#     `bindings_<os>_<arch>.rs` files (Windows additionally keyed by
#     env: msvc is the un-suffixed file, gnu is `bindings_windows_gnu_*`)
#     match each platform's actual ABI.
#
#   * `regen`: runs bindgen via `--features buildtime_bindgen` to
#     reproduce the corresponding per-target file. Uploads each result
#     as an artifact and **fails the job** if the regenerated file differs
#     from (or is missing relative to) the checked-in bindings. On failure a
#     maintainer downloads the artifacts and commits them to refresh bindings
#     after a `wrapper.h` change, `vendor/ReadStat` bump, or `bindgen` upgrade.
#
# Manual trigger (`workflow_dispatch`) is supported for cutting fresh
# bindings on demand without a PR.

on:
  pull_request:
    paths:
      - 'crates/readstat-sys/**'
      - 'crates/readstat-iconv-sys/**'
      # The consume matrix is the only place the test suite runs on
      # Windows/macOS/arm — without this filter, test-only changes would
      # silently skip cross-platform validation (e.g. the encoding tests,
      # whose expectations differ by platform iconv).
      - 'crates/readstat-tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/readstat-sys-ci.yml'
  push:
    branches: [main, dev]
    paths:
      - 'crates/readstat-sys/**'
      - 'crates/readstat-iconv-sys/**'
      - 'crates/readstat-tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/readstat-sys-ci.yml'
  workflow_dispatch:

jobs:
  consume:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            file: bindings_linux_x86_64.rs
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            file: bindings_linux_aarch64.rs
          - os: macos-15-intel
            target: x86_64-apple-darwin
            file: bindings_macos_x86_64.rs
          - os: macos-latest
            target: aarch64-apple-darwin
            file: bindings_macos_aarch64.rs
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            file: bindings_windows_x86_64.rs
          # windows-gnu runs on the same Windows host as windows-msvc — the
          # binaries execute natively — but uses the MinGW toolchain and the
          # GNU-ABI bindings file (C enums are unsigned under GCC/Clang,
          # signed under MSVC).
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            file: bindings_windows_gnu_x86_64.rs
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install MinGW toolchain (windows-gnu only)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        shell: pwsh
        run: |
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed mingw-w64-x86_64-gcc
          Add-Content $env:GITHUB_PATH "C:\msys64\mingw64\bin"

      - name: Add Rust target (windows-gnu only)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: rustup target add ${{ matrix.target }}

      - name: Build with default features (consumes pre-gen ${{ matrix.file }})
        run: cargo build --workspace --target ${{ matrix.target }}

      - name: Test
        run: cargo test --workspace --target ${{ matrix.target }}

  regen:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            file: bindings_linux_x86_64.rs
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            file: bindings_linux_aarch64.rs
          - os: macos-15-intel
            target: x86_64-apple-darwin
            file: bindings_macos_x86_64.rs
          - os: macos-latest
            target: aarch64-apple-darwin
            file: bindings_macos_aarch64.rs
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            file: bindings_windows_x86_64.rs
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            file: bindings_windows_gnu_x86_64.rs
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install LLVM (Windows only — bindgen needs libclang)
        if: matrix.os == 'windows-latest'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "17"

      - name: Install MinGW toolchain (windows-gnu only)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        shell: pwsh
        run: |
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed mingw-w64-x86_64-gcc
          Add-Content $env:GITHUB_PATH "C:\msys64\mingw64\bin"

      - name: Add Rust target (windows-gnu only)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: rustup target add ${{ matrix.target }}

      - name: Regenerate bindings
        # READSTAT_REGEN_BINDINGS opts in to refreshing the checked-in
        # per-target file — the feature alone only writes to OUT_DIR.
        env:
          READSTAT_REGEN_BINDINGS: "1"
        run: cargo build -p readstat-sys --features buildtime_bindgen --target ${{ matrix.target }}

      # Upload BEFORE the drift check so the artifact is downloadable even
      # when the diff step fails — that's exactly when the maintainer
      # needs to grab the freshly-generated file to commit.
      - name: Upload regenerated bindings
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.target }}
          path: crates/readstat-sys/src/bindings/${{ matrix.file }}

      - name: Fail if regenerated bindings differ from checked-in
        shell: bash
        run: |
          path="crates/readstat-sys/src/bindings/${{ matrix.file }}"
          # Existence + tracked checks catch a brand-new bindings file (e.g. a
          # freshly added target) that a plain content diff would silently pass.
          if [ ! -f "$path" ]; then
            echo "::error::$path does not exist after regeneration."
            echo "::error::Download the 'bindings-${{ matrix.target }}' artifact, copy it into crates/readstat-sys/src/bindings/, commit, and push."
            exit 1
          fi
          if ! git ls-files --error-unmatch -- "$path" >/dev/null 2>&1; then
            echo "::error::$path is untracked — commit the generated bindings."
            echo "::error::Download the 'bindings-${{ matrix.target }}' artifact, copy it into crates/readstat-sys/src/bindings/, commit, and push."
            exit 1
          fi
          # Compare with `git diff` (NOT `git status --porcelain`): it applies
          # the `.gitattributes` `*.rs text eol=lf` clean filter, so a pure
          # CRLF-vs-LF difference — bindgen/rustfmt emits CRLF on the Windows
          # runner — is not mistaken for real ABI drift. Real content changes
          # still fail. (git normalizes the artifact's CRLF to LF on commit.)
          if git --no-pager diff --no-color --exit-code -- "$path"; then
            echo "::notice::Bindings match a fresh regeneration for ${{ matrix.target }}."
          else
            echo "::error::Checked-in bindings/${{ matrix.file }} differ from what bindgen now produces."
            echo "::error::Download the 'bindings-${{ matrix.target }}' artifact from this run, copy it into crates/readstat-sys/src/bindings/, commit, and push."
            exit 1
          fi

  # readstat-iconv-sys is Windows-only and ships its own checked-in
  # pre-generated bindings (so consumers need no libclang). This job
  # regenerates `bindings_windows_x86_64.rs` on a Windows runner, uploads it,
  # and fails on drift — mirroring the `regen` job above. Use the uploaded
  # artifact to commit the file when first creating it or after a libiconv /
  # bindgen change.
  regen-iconv:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install LLVM (bindgen needs libclang)
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "17"

      - name: Regenerate iconv bindings
        # READSTAT_REGEN_BINDINGS opts in to refreshing the checked-in
        # per-target file — the feature alone only writes to OUT_DIR.
        env:
          READSTAT_REGEN_BINDINGS: "1"
        run: cargo build -p readstat-iconv-sys --features buildtime_bindgen

      - name: Upload regenerated iconv bindings
        uses: actions/upload-artifact@v7
        with:
          name: iconv-bindings-windows
          path: crates/readstat-iconv-sys/src/bindings/bindings_windows_x86_64.rs

      - name: Fail if regenerated bindings differ from checked-in
        shell: bash
        run: |
          file=crates/readstat-iconv-sys/src/bindings/bindings_windows_x86_64.rs
          if [ ! -f "$file" ]; then
            echo "::error::$file does not exist yet."
            echo "::error::Download the 'iconv-bindings-windows' artifact from this run, copy it into crates/readstat-iconv-sys/src/bindings/, commit, and push."
            exit 1
          fi
          if git --no-pager diff --no-color --exit-code "$file"; then
            echo "::notice::iconv bindings match a fresh regeneration."
          else
            echo "::error::Checked-in $file differs from what bindgen now produces."
            echo "::error::Download the 'iconv-bindings-windows' artifact from this run, copy it into crates/readstat-iconv-sys/src/bindings/, commit, and push."
            exit 1
          fi
